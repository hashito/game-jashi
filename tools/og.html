<!doctype html>
<!-- Share image template (1200x630). Captured headless by tools/make-og.mjs from the game's own images. -->
<html lang="ja"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0d0b}
.bg{position:absolute;inset:0;background:url(../dist/assets/title-forest.webp) center/cover;filter:brightness(.55) saturate(.7)}
.face{position:absolute;right:-40px;top:-60px;width:720px;height:720px;background:url(../dist/assets/textures/monster-face-v4.webp) center/cover;
  -webkit-mask-image:radial-gradient(ellipse 46% 52% at 50% 42%,#000 35%,transparent 78%);filter:brightness(.82) contrast(1.08) saturate(.75)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,8,.96) 0%,rgba(8,10,8,.82) 34%,rgba(8,10,8,.15) 62%,rgba(8,10,8,.35) 100%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 180px 40px #000}
.txt{position:absolute;left:84px;top:150px;color:#ece8dc;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif}
.eyebrow{font-size:22px;letter-spacing:.32em;color:#b9b4a4;margin:0 0 18px}
h1{font-size:150px;letter-spacing:.12em;margin:0;line-height:1;font-weight:600}
.sub{font-size:26px;letter-spacing:.4em;margin:26px 0 0;color:#d8d2c0}
.tag{font-size:21px;letter-spacing:.14em;margin:46px 0 0;color:#a7a291}
.rec{position:absolute;right:40px;top:34px;color:#e6e0cf;font:600 20px/1 Consolas,monospace;letter-spacing:.2em}
.rec i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c2392f;margin-right:10px}
</style></head><body>
<div class="bg"></div><div class="face"></div><div class="shade"></div><div class="scan"></div><div class="vig"></div>
<div class="rec"><i></i>REC 00:17:04</div>
<div class="txt"><p class="eyebrow">― あの山で、何を見た。</p><h1>邪視</h1><p class="sub">視線の山</p><p class="tag">一人称3Dホラー ／ ブラウザで無料</p></div>
</body></html>
